name: CI/CD Pipeline

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday 2 AM UTC
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag (optional)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1

jobs:
  # ==========================================
  # STAGE 1: Code Quality & Testing
  # ==========================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PortAudio runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install ruff mypy types-requests types-urllib3

      - name: Run Ruff (linting)
        run: ruff check .

      - name: Run MyPy (type checking)
        run: python -m mypy .

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing --timeout=60 -x

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ==========================================
  # STAGE 2: Security Scanning
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    # Trivy scans locally; SARIF is retained as an Actions artifact instead
    # of being sent to GitHub Code Scanning, which may not be enabled.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Archive Trivy SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-report
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Run Bandit (Python security)
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-results.json || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  # ==========================================
  # STAGE 3: Build & Push Images
  # ==========================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: security-scan
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Sign image (cosign)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'

      - name: Sign image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ steps.meta.outputs.tags }}

  # ==========================================
  # STAGE 4: Integration Tests
  # ==========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull test image
        run: docker pull ${{ needs.build.outputs.image-tag }}

      - name: Start test stack
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: Run health checks
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/api/health; then
              echo "Health check passed"
              break
            fi
            sleep 2
          done

      - name: Run API tests
        run: |
          pytest tests/integration/ -v --timeout=60

      - name: Run contract tests
        run: |
          pytest tests/contract/ -v --timeout=60

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v

  # ==========================================
  # STAGE 5: Staging Deployment (Blue-Green)
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration-tests
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging (blue-green)
        run: |
          # Blue-green deployment script
          ./scripts/deploy-blue-green.sh staging ${{ needs.build.outputs.image-tag }}

      - name: Verify staging deployment
        run: |
          ./scripts/verify-deployment.sh staging

      - name: Run smoke tests
        run: |
          ./scripts/smoke-tests.sh staging

  # ==========================================
  # STAGE 6: Production Deployment (Blue-Green)
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: integration-tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production (blue-green)
        run: |
          ./scripts/deploy-blue-green.sh production ${{ needs.build.outputs.image-tag }}

      - name: Verify production deployment
        run: |
          ./scripts/verify-deployment.sh production

      - name: Run smoke tests
        run: |
          ./scripts/smoke-tests.sh production

      - name: Notify on success
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{"text": "✅ Production deployment successful: ${{ needs.build.outputs.image-tag }}"}'

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{"text": "❌ Production deployment failed: ${{ needs.build.outputs.image-tag }}"}'

  # ==========================================
  # STAGE 7: Post-Deployment Monitoring
  # ==========================================
  post-deploy-monitoring:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [[ "${{ needs.deploy-staging.result }}" == "success" || "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "Deployment successful - monitoring for 5 minutes"
            sleep 300
            ./scripts/health-check.sh
          fi

      - name: Auto-rollback on failure
        if: failure()
        run: |
          echo "Deployment failed - initiating rollback"
          ./scripts/rollback.sh

  # ==========================================
  # STAGE 8: Chaos Engineering (Scheduled)
  # ==========================================
  chaos-engineering:
    name: Chaos Engineering
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run chaos experiments
        run: |
          ./scripts/chaos-engineering.sh

      - name: Collect results
        run: |
          ./scripts/collect-chaos-results.sh

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Chaos Engineering Experiment Failed',
              body: 'Chaos experiment failed. Check workflow logs for details.',
              labels: ['chaos', 'investigation']
            })
