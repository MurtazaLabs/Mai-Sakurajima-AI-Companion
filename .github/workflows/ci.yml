name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test Suite
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          python -m pip show SQLAlchemy alembic python-jose

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -q
        timeout-minutes: 25

  typecheck:
    name: Type Checking (mypy)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install mypy types-requests types-urllib3

      - name: Run mypy
        run: python -m mypy .
        timeout-minutes: 12

  lint:
    name: Lint (ruff)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  docker:
    name: Docker Build
    # The image is Linux (python:3.10-slim); windows-latest runs Docker in
    # Windows-container mode and cannot pull a Linux base image.
    runs-on: ubuntu-latest
    needs: [test, typecheck, lint]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set +e
          docker build -t mai-ai:latest . 2>&1 | tee docker-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Job logs need repository admin rights; annotate the tail instead.
            python -c "import urllib.parse as u; t = open('docker-build.log', encoding='utf-8', errors='replace').read(); print('::error title=docker-build-failed::' + u.quote(t[-2500:], safe=''))"
          fi
          exit "$status"
        shell: bash