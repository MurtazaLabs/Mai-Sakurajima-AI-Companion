# Mai AI — single-container deployment.
#
# Local-first companion: one process owns the microphone, the speaker and the
# vector store, so this runs exactly one replica. The container binds
# API_HOST=0.0.0.0 (uvicorn must listen on all interfaces inside the
# container), so auth is explicitly on.
#
# Prereqs: a .env with your API keys (OPENROUTER_API_KEY, ...); the key/data
# volume ./data:/app/data also carries the auto-generated HTTPS certs and
# the Obsidian vault (Dockerfile sets MAI_OBSIDIAN_VAULT=/app/data/vault).
services:
  mai-ai:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - API_HOST=0.0.0.0
      - API_REQUIRE_AUTH=true
    volumes:
      - ./data:/app/data            # certs, JWT secret, vault (Dockerfile: /app/data/vault)
      - ./vector_memory:/app/vector_memory
      - ./memory:/app/memory
      - ./cache:/app/cache
      - ./logs:/app/logs
    restart: unless-stopped
