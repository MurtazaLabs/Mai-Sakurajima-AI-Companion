<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/page-redirect.js" data-page="chat"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mai OS — Lounge</title>
<link rel="shortcut icon" href="img/ChatGPT Image Jul 22, 2026, 07_27_22 AM.png" type="image/x-icon">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/orb.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div class="page">
  <div id="wallpaper" style="position:fixed;inset:0;z-index:0;background:url('img/Conversations.png') center/cover no-repeat" aria-hidden="true"></div>
  <div id="wallpaper-overlay" aria-hidden="true"></div>
  <div class="page-content" style="position:relative;z-index:1;display:flex;flex-direction:column;padding:0">
    <!-- Mai header -->
    <div id="chat-header">
      <a class="back-btn" href="index.html" style="position:absolute;top:12px;left:12px;z-index:5;padding:4px 10px;font-size:11px" aria-label="Back to desktop">← Desktop</a>
      <div id="chat-avatar"><img src="img/Conversations.png" alt="Mai"></div>
      <div id="chat-avatar-name">Mai</div>
      <div id="chat-avatar-status">Online — Listening</div>
    </div>
    <!-- Voice status bar -->
    <div id="voice-status" class="voice-status-bar">
      <span class="voice-status-item" id="vs-state"><span class="status-dot offline"></span> Voice off</span>
      <span class="voice-status-item" id="vs-wake">Wake: —</span>
      <span class="voice-status-item" id="vs-speaking">Speaking: —</span>
    </div>
    <!-- Messages -->
    <div class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-label="Chat messages" tabindex="-1"></div>
    <!-- Input -->
    <div class="chat-input-area">
      <input class="chat-input" id="chat-input" type="text" placeholder="Message Mai..." autofocus aria-label="Message input" style="font-size:16px">
      <button class="chat-send" id="chat-send" aria-label="Send message">Send</button>
    </div>
  </div>

  <div id="status-bar">
    <div class="status-indicator">
      <span class="status-dot online" id="status-dot"></span>
      <span id="status-text">Connecting...</span>
    </div>
    <div class="status-divider"></div>
    
    <div class="status-divider"></div>
    <div class="status-indicator"><span id="status-voice">🎤 —</span></div>
    <div class="status-divider"></div>
    <div class="status-indicator"><span id="status-memory">🧠 —</span></div>
  </div>

  <div id="taskbar">
    <button id="start-btn"><span class="dot"></span><span>Mai</span></button>
    <div id="taskbar-apps"></div>
    <span id="taskbar-clock">00:00</span>
  </div>

  <div id="start-menu">
    <div id="start-menu-header">Applications</div>
    <div id="start-menu-list"></div>
  </div>
</div>
<script src="js/os.js"></script>
<script src="js/chat.js"></script>
<script src="js/motion.js"></script>
<script src="js/orb.js"></script>
</body>
</html>
