<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — MAI</title>
  <link rel="shortcut icon" href="/img/ChatGPT Image Jul 22, 2026, 07_27_22 AM.png" type="image/x-icon">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/utilities.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <svg class="login-mark" viewBox="0 0 64 64" width="48" height="48" aria-hidden="true" focusable="false">
          <ellipse cx="32" cy="32" rx="26" ry="14" transform="rotate(-24 32 32)" fill="none" stroke="var(--color-accent-primary)" stroke-opacity="0.35" stroke-width="1.5"/>
          <ellipse cx="32" cy="32" rx="26" ry="14" transform="rotate(24 32 32)" fill="none" stroke="var(--color-accent-primary)" stroke-opacity="0.25" stroke-width="1.5"/>
          <path d="M14 46 V18 L32 36 L50 18 V46" fill="none" stroke="var(--color-accent-primary)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="50" cy="18" r="3.5" fill="var(--color-accent-soft)"/>
        </svg>
        <div>
          <p class="t-overline">MAI COGNITIVE OS</p>
          <h1 id="login-title" class="t-h3">Welcome back</h1>
        </div>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="input-group">
          <label class="input-label" for="username">Username</label>
          <input class="input" id="username" name="username" type="text" autocomplete="username" required maxlength="64" placeholder="you">
        </div>
        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="••••••••">
          <p class="input-hint" id="password-hint" hidden>At least 6 characters</p>
        </div>
        <div class="login-error" id="login-error" role="alert" hidden></div>
        <button class="btn btn-primary" id="submit-btn" type="submit">Sign in</button>
        <p class="login-status" id="login-status" hidden></p>
      </form>

      <p class="login-switch">
        <span id="switch-prompt">New to MAI?</span>
        <button type="button" class="link-btn" id="mode-toggle">Create an account</button>
      </p>
    </section>
    <p class="login-footnote">MAI Cognitive OS · local instance</p>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
