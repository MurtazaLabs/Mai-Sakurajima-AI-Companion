<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Inputs & Forms</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0F1117; color: #F4F6F8; padding: 24px; }
h1 { font-size: 32px; font-weight: 600; margin-bottom: 8px; }
h2 { font-size: 24px; font-weight: 600; margin: 32px 0 16px; }
p { font-size: 16px; color: #A9B0BD; margin-bottom: 24px; }
.form-group { margin-bottom: 20px; max-width: 400px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; color: #A9B0BD; margin-bottom: 6px; }
.input { width: 100%; height: 48px; border-radius: 12px; background: #171A21; border: 1px solid rgba(255,255,255,0.06); padding: 0 16px; color: #F4F6F8; font-size: 16px; outline: none; transition: all 200ms; }
.input:focus { border-color: #5E81F4; box-shadow: 0 0 0 3px rgba(94,129,244,0.15); }
.input::placeholder { color: #A9B0BD; }
textarea.input { height: 120px; padding: 12px 16px; resize: vertical; font-family: inherit; }
select.input { appearance: none; cursor: pointer; }
.checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; cursor: pointer; }
.checkbox-group input { width: 20px; height: 20px; accent-color: #5E81F4; cursor: pointer; }
</style>
</head>
<body>
<h1>Inputs & Forms</h1>
<p>Height: 48px. Radius: 12px. Focus glow: accent shadow.</p>

<div class="form-group"><label>Text Input</label><input class="input" type="text" placeholder="Enter your name"></div>
<div class="form-group"><label>Email</label><input class="input" type="email" placeholder="you@example.com"></div>
<div class="form-group"><label>Password</label><input class="input" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"></div>
<div class="form-group"><label>Textarea</label><textarea class="input" placeholder="Write something..."></textarea></div>
<div class="form-group"><label>Select</label><select class="input"><option>Option 1</option><option>Option 2</option><option>Option 3</option></select></div>

<h2>Checkboxes</h2>
<div class="checkbox-group"><input type="checkbox" id="c1"><label for="c1">Enable notifications</label></div>
<div class="checkbox-group"><input type="checkbox" id="c2"><label for="c2">Auto-save responses</label></div>

<h2>Input with Icon</h2>
<div class="form-group" style="position:relative">
<label>Search</label>
<input class="input" type="text" placeholder="Search memories..." style="padding-left:44px">
<div style="position:absolute; left:14px; bottom:14px; color:#A9B0BD; font-size:18px;">&#x1F50D;</div>
</div>
</body>
</html>
