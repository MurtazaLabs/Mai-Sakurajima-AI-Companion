<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Sidebar + Top Bar</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0F1117; color: #F4F6F8; }
.topbar { height: 64px; background: #171A21; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar-left h1 { font-size: 18px; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #49D17D; box-shadow: 0 0 6px rgba(73,209,125,0.5); display: inline-block; }
.status-text { font-size: 13px; color: #A9B0BD; }
.clock { font-size: 13px; color: #A9B0BD; }
.badge { background: rgba(94,129,244,0.15); color: #5E81F4; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; }
.layout { display: flex; height: calc(100vh - 64px); }
.sidebar { width: 280px; background: #171A21; border-right: 1px solid rgba(255,255,255,0.06); padding: 16px 8px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.sidebar-section { font-size: 11px; font-weight: 600; color: #A9B0BD; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px 4px; }
.sidebar-item { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 8px; cursor: pointer; color: #A9B0BD; font-size: 14px; font-weight: 500; transition: all 100ms; }
.sidebar-item:hover { background: rgba(255,255,255,0.04); color: #F4F6F8; }
.sidebar-item.active { background: rgba(94,129,244,0.12); color: #5E81F4; }
.sidebar-item .icon { width: 20px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.content { flex: 1; padding: 24px; }
.content h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
.content p { font-size: 16px; color: #A9B0BD; }
</style>
</head>
<body>
<div class="topbar">
<div class="topbar-left">
<h1>Mai</h1>
<span class="status-dot"></span>
<span class="status-text">Ready</span>
</div>
<div class="topbar-right">
<span class="badge">3 active</span>
<span class="clock" id="clock"></span>
</div>
</div>
<div class="layout">
<div class="sidebar">
<div class="sidebar-section">Main</div>
<div class="sidebar-item active"><span class="icon">&#x1F4AC;</span> Chat</div>
<div class="sidebar-item"><span class="icon">&#x1F4CA;</span> Dashboard</div>
<div class="sidebar-item"><span class="icon">&#x1F50D;</span> Search</div>
<div class="sidebar-section">Workspace</div>
<div class="sidebar-item"><span class="icon">&#x1F4C1;</span> Knowledge</div>
<div class="sidebar-item"><span class="icon">&#x1F9E0;</span> Memories</div>
<div class="sidebar-item"><span class="icon">&#x1F3AF;</span> Goals</div>
<div class="sidebar-section">System</div>
<div class="sidebar-item"><span class="icon">&#x2699;</span> Settings</div>
</div>
<div class="content">
<h2>Dashboard</h2>
<p>Select a section from the sidebar.</p>
</div>
</div>
<script>
function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
updateClock(); setInterval(updateClock, 10000);
</script>
</body>
</html>
