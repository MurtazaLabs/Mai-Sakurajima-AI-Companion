# MkDocs configuration for Mai AI Documentation site
# Theme: Material with dark/light toggle, search, code copy

site_name: Mai AI Documentation
site_description: Production-oriented modular AI companion — documentation
site_author: Syed Murtaza
site_url: https://mai-ai.github.io/docs

repo_name: mai-ai
repo_url: https://github.com/username/mai-ai

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - git-revision-date-localized

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.emoji
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Development: development.md
  - Deployment: deployment.md
  - Configuration: configuration.md
  - Memory System: memory.md
  - Voice System: voice.md
  - Troubleshooting: troubleshooting.md
  - Operations: operations.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/username/mai-ai

copyright: Copyright &copy; 2026 Syed Murtaza
