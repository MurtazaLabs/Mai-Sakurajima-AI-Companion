# Alembic configuration (Phase 2c).
#
# The database URL is resolved at runtime by core/state/alembic/env.py via
# core.state.database.get_database_url():
#   POSTGRES_DSN -> DATABASE_URL -> sqlite:///{MEMORY_DIR}/mai.db
# The sqlalchemy.url below is only a placeholder and is overridden online.
[alembic]
script_location = core/state/alembic
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
